server:
    port: 8080

spring:
    application:
        name: bckdbank

    datasource:
        # MySQL debe estar disponible antes de iniciar la aplicación.
        url: ${DB_URL:jdbc:mysql://localhost:3306/db_bank?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
        username: ${DB_USERNAME:root}
        password: ${DB_PASSWORD:}
        driver-class-name: com.mysql.cj.jdbc.Driver

    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                format_sql: true
                dialect: org.hibernate.dialect.MySQLDialect

app:
    jwt:
        secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
        expiration-ms: 86400000
    cors:
        # URLs del frontend que pueden llamar a la API (Vite dev = 5173, vite preview = 4173).
        allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}

    finnhub:
        # Clave gratuita en https://finnhub.io/register. Sin ella el panel de mercado muestra un aviso.
        api-key: ${FINNHUB_API_KEY:}
        base-url: https://finnhub.io/api/v1
